name: Continuous Integration Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows MSVC 2022 (C++20)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build Debug
        run: cmake --build build --config Debug --parallel

      - name: Run CTest Unit Tests
        run: ctest --test-dir build -C Debug --output-on-failure --verbose

  linux-build:
    name: Linux (${{ matrix.compiler }} - ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            build_type: Debug
            asan: OFF
          - compiler: clang-16
            cc: clang-16
            cxx: clang++-16
            build_type: Debug
            asan: OFF
          - compiler: clang-16-asan
            cc: clang-16
            cxx: clang++-16
            build_type: Debug
            asan: ON
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libx11-dev \
            xvfb \
            ninja-build \
            gcc-13 \
            g++-13 \
            clang-16

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.asan }}" = "ON" ]; then
            EXTRA_FLAGS="-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_C_FLAGS=-fsanitize=address,undefined"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            $EXTRA_FLAGS

      - name: Build Target
        run: cmake --build build --parallel

      - name: Run CTest with Xvfb
        run: |
          xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Headless Desktop App Smoke Test
        run: |
          if [ -f "./build/bin/desktop_app" ]; then
            xvfb-run -a ./build/bin/desktop_app --headless || true
          fi

  macos-build:
    name: macOS Apple Clang (C++20)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build Debug
        run: cmake --build build --config Debug --parallel

      - name: Run CTest Unit Tests
        run: ctest --test-dir build -C Debug --output-on-failure

  android-build:
    name: Android NDK Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26b
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Assemble Android Debug APK
        run: ./gradlew assembleDebug --stacktrace
